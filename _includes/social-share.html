<div class="social-share">
  <span class="share-label">Share this post:</span>
  <div class="share-buttons">
    <a href="https://twitter.com/intent/tweet?text={{ page.title | url_encode }}&url={{ site.url }}{{ site.baseurl }}{{ page.url }}" 
       target="_blank" 
       rel="noopener noreferrer"
       class="share-btn twitter"
       aria-label="Share on Twitter">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <path d="M23 3a10.9 10.9 0 01-3.14 1.53 4.48 4.48 0 00-7.86 3v1A10.66 10.66 0 013 4s-4 9 5 13a11.64 11.64 0 01-7 2c9 5 20 0 20-11.5a4.5 4.5 0 00-.08-.83A7.72 7.72 0 0023 3z"/>
      </svg>
      Twitter
    </a>
    <a href="https://www.linkedin.com/sharing/share-offsite/?url={{ site.url }}{{ site.baseurl }}{{ page.url }}" 
       target="_blank" 
       rel="noopener noreferrer"
       class="share-btn linkedin"
       aria-label="Share on LinkedIn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <path d="M16 8a6 6 0 016 6v7h-4v-7a2 2 0 00-2-2 2 2 0 00-2 2v7h-4v-7a6 6 0 016-6zM2 9h4v12H2z"/>
        <circle cx="4" cy="4" r="2"/>
      </svg>
      LinkedIn
    </a>
    <a href="https://www.facebook.com/sharer/sharer.php?u={{ site.url }}{{ site.baseurl }}{{ page.url }}" 
       target="_blank" 
       rel="noopener noreferrer"
       class="share-btn facebook"
       aria-label="Share on Facebook">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <path d="M18 2h-3a5 5 0 00-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 011-1h3z"/>
      </svg>
      Facebook
    </a>
    <button onclick="navigator.share({title: '{{ page.title }}', url: '{{ site.url }}{{ site.baseurl }}{{ page.url }}'})" 
            class="share-btn native-share"
            aria-label="Share via native share">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="18" cy="5" r="3"/>
        <circle cx="6" cy="12" r="3"/>
        <circle cx="18" cy="19" r="3"/>
        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
      </svg>
      Share
    </button>
  </div>
</div>

<style>
.social-share {
  margin: 30px 0;
  padding: 20px;
  background: var(--lightGray);
  border-radius: 8px;
  border: 1px solid var(--border-color);
}

.share-label {
  display: block;
  margin-bottom: 12px;
  font-weight: 600;
  color: var(--darkGray);
}

.share-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.share-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  border-radius: 6px;
  text-decoration: none;
  font-size: 0.9rem;
  font-weight: 500;
  transition: all 0.2s ease;
  border: 1px solid var(--border-color);
  background: var(--white);
  color: var(--darkGray);
  cursor: pointer;
}

.share-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 6px rgba(0,0,0,0.1);
}

.share-btn.twitter:hover {
  background: #1DA1F2;
  color: white;
  border-color: #1DA1F2;
}

.share-btn.linkedin:hover {
  background: #0077B5;
  color: white;
  border-color: #0077B5;
}

.share-btn.facebook:hover {
  background: #1877F2;
  color: white;
  border-color: #1877F2;
}

.share-btn.native-share:hover {
  background: var(--blue);
  color: white;
  border-color: var(--blue);
}

.share-btn svg {
  flex-shrink: 0;
}
</style>

<script>
  // Hide native share button if not supported
  if (!navigator.share) {
    document.querySelector('.native-share')?.style.display = 'none';
  }
</script>
