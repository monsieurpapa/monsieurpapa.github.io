    <meta charset="utf-8" />
    <meta content='text/html; charset=utf-8' http-equiv='Content-Type'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0'>

    {% if page.excerpt %}
    <meta name="description" content="{{ page.excerpt| strip_html | truncate: 160 }}" />
    <meta property="og:description" content="{{ page.excerpt| strip_html | truncate: 160 }}" />
    {% else %}
    <meta name="description" content="{{ site.description }}">
    <meta property="og:description" content="{{ site.description }}" />
    {% endif %}
    <meta name="author" content="{{ site.name }}" />

    {% if page.title %}
    <meta property="og:title" content="{{ page.title }} – {{ site.name }}" />
    <meta property="twitter:title" content="{{ page.title }} – {{ site.name }}" />
    {% else %}
    <meta property="og:title" content="{{ site.name }} – {{ site.description }}" />
    <meta property="twitter:title" content="{{ site.name }} – {{ site.description }}" />
    {% endif %}

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="{% if page.title %}article{% else %}website{% endif %}" />
    <meta property="og:url" content="{{ site.url }}{{ site.baseurl }}{{ page.url }}" />
    {% if page.image %}
    <meta property="og:image" content="{{ site.url }}{{ site.baseurl }}{{ page.image }}" />
    {% else %}
    <meta property="og:image" content="{{ site.url }}{{ site.baseurl }}/images/dieudo.jpeg" />
    {% endif %}
    <meta property="og:site_name" content="{{ site.name }}" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@{{ site.footer-links.twitter }}" />
    {% if page.image %}
    <meta name="twitter:image" content="{{ site.url }}{{ site.baseurl }}{{ page.image }}" />
    {% endif %}

    <!-- Schema.org structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "{% if page.title %}BlogPosting{% else %}Person{% endif %}",
      {% if page.title %}
      "headline": "{{ page.title }}",
      "datePublished": "{{ page.date | date: '%Y-%m-%d' }}",
      "author": {
        "@type": "Person",
        "name": "{{ site.name }}",
        "url": "{{ site.url }}{{ site.baseurl }}/about"
      },
      "publisher": {
        "@type": "Organization",
        "name": "{{ site.name }}",
        "logo": {
          "@type": "ImageObject",
          "url": "{{ site.url }}{{ site.baseurl }}{{ site.avatar }}"
        }
      },
      {% else %}
      "name": "{{ site.name }}",
      "jobTitle": "{{ site.description }}",
      "url": "{{ site.url }}{{ site.baseurl }}",
      "sameAs": [
        "https://www.linkedin.com/in/{{ site.footer-links.linkedin }}",
        "https://github.com/{{ site.footer-links.github }}",
        "https://twitter.com/{{ site.footer-links.twitter }}"
      ],
      {% endif %}
      "description": "{{ page.excerpt | default: site.description | strip_html | truncate: 160 }}"
    }
    </script>
