{% assign min_headings = 3 %}
{% assign headings = content | split: '<h' | size | minus: 1 %}

{% if headings >= min_headings %}
<div class="table-of-contents" id="toc">
  <h3>📋 Table of Contents</h3>
  <nav class="toc-nav" id="toc-nav">
    <!-- Generated by JavaScript -->
  </nav>
</div>

<script>
  (function() {
    const entry = document.querySelector('.entry');
    if (!entry) return;

    const headings = entry.querySelectorAll('h2, h3, h4');
    if (headings.length < {{ min_headings }}) return;

    const tocNav = document.getElementById('toc-nav');
    if (!tocNav) return;

    let tocHTML = '<ul class="toc-list">';
    let currentLevel = 2;

    headings.forEach((heading, index) => {
      const level = parseInt(heading.tagName.substring(1));
      const id = heading.id || `heading-${index}`;
      if (!heading.id) {
        heading.id = id;
      }

      // Close previous list items if moving up levels
      while (currentLevel < level) {
        tocHTML += '<ul class="toc-sublist">';
        currentLevel++;
      }
      while (currentLevel > level) {
        tocHTML += '</ul></li>';
        currentLevel--;
      }

      tocHTML += `<li class="toc-item toc-level-${level}">`;
      tocHTML += `<a href="#${id}" class="toc-link">${heading.textContent}</a>`;
    });

    // Close all remaining lists
    while (currentLevel >= 2) {
      tocHTML += '</li></ul>';
      currentLevel--;
    }

    tocNav.innerHTML = tocHTML;

    // Smooth scroll and highlight active section
    tocNav.addEventListener('click', function(e) {
      if (e.target.classList.contains('toc-link')) {
        e.preventDefault();
        const targetId = e.target.getAttribute('href').substring(1);
        const targetElement = document.getElementById(targetId);
        if (targetElement) {
          const offset = 100;
          const elementPosition = targetElement.getBoundingClientRect().top;
          const offsetPosition = elementPosition + window.pageYOffset - offset;

          window.scrollTo({
            top: offsetPosition,
            behavior: 'smooth'
          });
        }
      }
    });

    // Highlight active section on scroll
    const tocLinks = tocNav.querySelectorAll('.toc-link');
    const observerOptions = {
      rootMargin: '-20% 0px -70% 0px',
      threshold: 0
    };

    const observer = new IntersectionObserver(function(entries) {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          tocLinks.forEach(link => link.classList.remove('active'));
          const activeLink = tocNav.querySelector(`a[href="#${entry.target.id}"]`);
          if (activeLink) {
            activeLink.classList.add('active');
          }
        }
      });
    }, observerOptions);

    headings.forEach(heading => observer.observe(heading));
  })();
</script>

<style>
.table-of-contents {
  background: var(--lightGray);
  padding: 25px;
  border-radius: 10px;
  border: 1px solid var(--border-color);
  margin: 30px 0;
  position: sticky;
  top: 100px;
  max-height: calc(100vh - 120px);
  overflow-y: auto;
}

.table-of-contents h3 {
  margin-top: 0;
  margin-bottom: 15px;
  font-size: 1.2rem;
  color: var(--blue);
}

.toc-nav {
  font-size: 0.95rem;
}

.toc-list, .toc-sublist {
  list-style: none;
  padding: 0;
  margin: 0;
}

.toc-item {
  margin-bottom: 8px;
}

.toc-link {
  color: var(--darkGray);
  text-decoration: none;
  display: block;
  padding: 6px 10px;
  border-radius: 4px;
  transition: all 0.2s;
  line-height: 1.4;
}

.toc-link:hover {
  background: var(--white);
  color: var(--blue);
  padding-left: 15px;
}

.toc-link.active {
  background: var(--blue);
  color: white;
  font-weight: 600;
}

.toc-level-3 {
  padding-left: 15px;
}

.toc-level-4 {
  padding-left: 30px;
}

.toc-sublist {
  margin-left: 10px;
  margin-top: 5px;
}

@media (max-width: 768px) {
  .table-of-contents {
    position: relative;
    top: 0;
    max-height: none;
  }
}
</style>
{% endif %}
